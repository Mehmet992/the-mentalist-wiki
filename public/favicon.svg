<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>
    <linearGradient id="crimsonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Obsidian & Deep Ruby Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" stroke="url(#crimsonStroke)" stroke-width="3" />

  <!-- Red John Signature Painted Circle & Drips -->
  <circle cx="32" cy="31" r="20" stroke="url(#crimsonStroke)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="115 10" />
  <path d="M22 49 L22 55" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" />
  <path d="M39 50 L39 57" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" />

  <!-- Red John Eyes -->
  <ellipse cx="25" cy="25.5" rx="2.6" ry="3.8" fill="#ef4444" />
  <ellipse cx="39" cy="25.5" rx="2.6" ry="3.8" fill="#ef4444" />

  <!-- Red John Painted Smile -->
  <path d="M20.5 34.5 C24 42.5, 40 42.5, 43.5 34.5" stroke="#ef4444" stroke-width="3.4" stroke-linecap="round" fill="none" />
</svg>
